<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142b3b">
  <title>Thank You | Homes Protector</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f5f1;color:#18252d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .card{max-width:600px;width:100%;background:#fff;border-radius:22px;padding:clamp(28px,6vw,56px);text-align:center;box-shadow:0 18px 45px rgba(20,43,59,.12)}
    .logo{font-size:19px;font-weight:900;color:#142b3b;margin-bottom:24px;letter-spacing:-0.5px}
    .logo span{color:#f2a23a}
    .icon{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#e5f3e9;color:#227344;font-size:2rem;font-weight:900}
    h1{color:#142b3b;line-height:1.1;letter-spacing:-.04em;font-size:clamp(2rem,6vw,3rem);margin-top:0}
    p{color:#5f6d75;line-height:1.7}
    .btn{display:inline-block;margin-top:20px;padding:13px 24px;border-radius:10px;background:#f2a23a;color:#142b3b;text-decoration:none;font-weight:800}
    .btn:hover{background:#ffb94f}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">HOMES <span>PROTECTOR</span></div>
    <div class="icon" aria-hidden="true">✓</div>
    <h1>Thank you for reaching out!</h1>
    <p>Your estimate request has been submitted to Homes Protector. Our team will follow up with you shortly to discuss your project details and next steps. If you need immediate assistance, please reach out directly through our landing page.</p>
    <a class="btn" href="index.html">Back to Home</a>
  </main>
</body>
</html>
